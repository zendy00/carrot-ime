# src/ 변경이 main에 push되면 self-contained 단일 exe를 publish하고 GitHub Release를 만든다.
# 버전: 1.0.0.<run_number> — build.counter를 run_number-1로 심어 csproj의
# AutoIncrementBuildNumber 타깃이 run_number를 만들게 한다.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 릴리즈 노트에 넣을 이전 태그·커밋 이력 조회용

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/CarrotIME.Core.Tests/CarrotIME.Core.Tests.csproj -c Release

      - name: Set build number
        shell: bash
        run: echo $((GITHUB_RUN_NUMBER - 1)) > src/CarrotIME/build.counter

      - name: Publish
        run: dotnet publish src/CarrotIME/CarrotIME.csproj -p:PublishProfile=win-x64

      # 자산 이름은 버전 없이 CarrotIME.exe로 고정한다. 자동 시작이 작업 스케줄러에
      # exe 절대경로를 등록하므로, 파일명이 바뀌면 업데이트 후 자동실행이 깨진다.
      # 같은 이름으로 덮어쓰면 등록 경로가 계속 유효하다. 버전은 태그와 FileVersion으로 식별.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls src/CarrotIME/bin/publish/CarrotIME-*.exe)
          version=$(basename "$exe" .exe)
          version=${version#CarrotIME-}
          mv "$exe" src/CarrotIME/bin/publish/CarrotIME.exe
          # --generate-notes는 직접 push된 커밋을 본문에 싣지 않으므로(PR 기반),
          # 이전 태그 이후 커밋 제목을 노트 앞부분에 직접 넣는다.
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          notes=$(git log --pretty='- %s' ${prev:+$prev..HEAD})
          gh release create "v$version" src/CarrotIME/bin/publish/CarrotIME.exe \
            --title "CarrotIME v$version" \
            --notes "$notes" \
            --generate-notes
